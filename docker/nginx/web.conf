# Inside the web container: serves the SPA and forwards /api to the API container.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  # Behind the edge proxy this server listens on 8080: never put its own host and port into a redirect (the browser would hang).
  absolute_redirect off;
  client_max_body_size 11m;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com blob:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://login.microsoftonline.com" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /healthz { access_log off; return 200 "ok"; }

  # The AI reading of a title file can take a few minutes (FR-127); the other API routes keep the default wait.
  location ~ ^/api/career/titles/[^/]+/file/ai$ {
    proxy_pass http://api:3000;
    # nosemgrep: generic.nginx.security.request-host-used.request-host-used  (only the edge proxy reaches this server, and it pins Host)
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 300s;
  }

  location /api/ {
    proxy_pass http://api:3000;
    # nosemgrep: generic.nginx.security.request-host-used.request-host-used  (only the edge proxy reaches this server, and it pins Host)
    proxy_set_header Host $host;
    # The edge proxy already replaced X-Forwarded-For with the real client address.
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    try_files $uri =404;
  }

  # The branded user manual (static pages built by scripts/build-user-manual.mjs); public, no sign-in.
  location = /docs { return 301 /docs/; }
  location ~ ^/docs/(ar|en)$ { return 301 /docs/$1/; }
  location /docs/ {
    try_files $uri $uri/index.html =404;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
