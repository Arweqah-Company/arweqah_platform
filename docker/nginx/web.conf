# Inside the web container: serves the SPA and forwards /api to the API container.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 11m;

  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://login.microsoftonline.com" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /healthz { access_log off; return 200 "ok"; }

  location /api/ {
    proxy_pass http://api:3000;
    # nosemgrep: generic.nginx.security.request-host-used.request-host-used  (only the edge proxy reaches this server, and it pins Host)
    proxy_set_header Host $host;
    # The edge proxy already replaced X-Forwarded-For with the real client address.
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
