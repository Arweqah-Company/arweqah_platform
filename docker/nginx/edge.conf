# Edge proxy on the EC2 host: TLS termination. nginx renders ${APP_HOST} and ${API_HOST} (from .env) when the container starts.
# ${APP_HOST}: the web app (it forwards /api to the API, so the browser stays on one origin and cookies stay first-party).
# ${API_HOST}: the same API reached directly (integrations, tools); it serves nothing but /api.
server {
  listen 80;
  server_name ${APP_HOST};
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://${APP_HOST}$request_uri; }
}

server {
  listen 80;
  server_name ${API_HOST};
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://${API_HOST}$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name ${APP_HOST};
  server_tokens off;
  ssl_certificate     /etc/letsencrypt/live/${APP_HOST}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/${APP_HOST}/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  client_max_body_size 11m;

  location / {
    proxy_pass http://web:8080;
    proxy_set_header Host ${APP_HOST};
    # Overwrite (not append): clients cannot spoof their address for rate limits and audit logs.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name ${API_HOST};
  server_tokens off;
  ssl_certificate     /etc/letsencrypt/live/${APP_HOST}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/${APP_HOST}/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  client_max_body_size 11m;

  # The AI reading of a title file can take a few minutes (FR-127); the other API routes keep the default wait.
  location ~ ^/api/career/titles/[^/]+/file/ai$ {
    proxy_pass http://api:3000;
    proxy_set_header Host ${API_HOST};
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host ${API_HOST};
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location / { return 404; }
}
