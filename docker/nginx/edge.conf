# Edge proxy on the EC2 host: TLS termination for app.<domain>. Replace __DOMAIN__.
server {
  listen 80;
  server_name app.__DOMAIN__;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name app.__DOMAIN__;
  server_tokens off;
  ssl_certificate     /etc/letsencrypt/live/app.__DOMAIN__/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/app.__DOMAIN__/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  client_max_body_size 11m;

  location / {
    proxy_pass http://web:8080;
    proxy_set_header Host $host;
    # Overwrite (not append): clients cannot spoof their address for rate limits and audit logs.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
