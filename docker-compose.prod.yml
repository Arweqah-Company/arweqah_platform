# Production on one EC2 host (set up by scripts/server/bootstrap.sh). PostgreSQL, RabbitMQ and uploaded files live in
# Docker volumes on the host (backups: scripts/server/backup.sh). To use Amazon RDS instead, point DB_HOST at it and drop the postgres service.
# Nothing but nginx is published.
name: arweqah-platform

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 10
    restart: unless-stopped
    logging: *logging

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes: [rabbitmq_data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      retries: 10
    restart: unless-stopped
    logging: *logging

  api:
    image: ${REGISTRY}/${IMAGE_PREFIX}-api:${TAG:-latest}
    env_file: .env
    environment:
      NODE_ENV: production
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      DB_HOST: postgres
      LOCAL_STORAGE_DIR: /data/storage
    volumes:
      - api_storage:/data/storage
      - ./secrets:/run/secrets/app:ro
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped
    logging: *logging

  web:
    image: ${REGISTRY}/${IMAGE_PREFIX}-web:${TAG:-latest}
    depends_on: [api]
    restart: unless-stopped
    logging: *logging

  nginx:
    image: nginx:1.29-alpine
    ports: ["80:80", "443:443"]
    environment:
      APP_HOST: ${APP_HOST}
      API_HOST: ${API_HOST}
    volumes:
      - ./docker/nginx/edge.conf:/etc/nginx/templates/default.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on: [web]
    restart: unless-stopped
    logging: *logging

volumes:
  pg_data:
  api_storage:
  rabbitmq_data:
