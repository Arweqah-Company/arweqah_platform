# Production on EC2. PostgreSQL is Amazon RDS (DB_HOST in .env); nothing but nginx is published.
name: arweqah-platform

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes: [rabbitmq_data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      retries: 10
    restart: unless-stopped
    logging: *logging

  api:
    image: ${REGISTRY}/${IMAGE_PREFIX}-api:${TAG:-latest}
    env_file: .env
    environment:
      NODE_ENV: production
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
    depends_on:
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped
    logging: *logging

  web:
    image: ${REGISTRY}/${IMAGE_PREFIX}-web:${TAG:-latest}
    depends_on: [api]
    restart: unless-stopped
    logging: *logging

  nginx:
    image: nginx:1.29-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./docker/nginx/edge.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on: [web]
    restart: unless-stopped
    logging: *logging

volumes:
  rabbitmq_data:
