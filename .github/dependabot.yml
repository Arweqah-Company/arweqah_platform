version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    # 0 = no npm PRs: Dependabot generates a lockfile without eslint/vitest here (npm ci then fails).
    # Dependencies are upgraded by hand; npm audit in security.yml still reports advisories.
    open-pull-requests-limit: 0
    ignore:
      # TypeScript stays on 5.9 (decision 74): 7 removes `baseUrl` (TS5102) and breaks ts-node / typescript-eslint.
      - dependency-name: typescript
      # NestJS stays on 11 (decision 3): nestjs-zod does not support 12 yet.
      - dependency-name: "@nestjs/*"
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories: [/apps/api, /apps/web]
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
