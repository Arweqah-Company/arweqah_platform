name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency: deploy-production

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  IMAGE_PREFIX: arweqah-platform

jobs:
  build:
    # workflow_run also fires for pull requests; only a successful CI run of a push to main (never a fork's code) may deploy.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    steps:
      # Safe: the job runs only for a successful CI run of a push to main (see the `if`), never for pull requests or forks.
      # nosemgrep: yaml.github-actions.security.workflow-run-target-code-checkout.workflow-run-target-code-checkout
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase registry
        run: echo "REGISTRY=${REGISTRY,,}" >> $GITHUB_ENV
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          build-args: |
            VITE_MICROSOFT_ENABLED=${{ vars.MICROSOFT_ENABLED || 'false' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:${{ github.event.workflow_run.head_sha || github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: Scan image
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:${{ github.event.workflow_run.head_sha || github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'push'
    permissions:
      contents: read
      packages: read
    steps:
      # Safe: the job runs only for a successful CI run of a push to main (see the `if`), never for pull requests or forks.
      # nosemgrep: yaml.github-actions.security.workflow-run-target-code-checkout.workflow-run-target-code-checkout
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # Compose file, nginx template and deploy scripts travel with the code, so changing them deploys them too.
      - uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.prod.yml,docker/nginx/edge.conf,scripts/server/deploy.sh,scripts/server/backup.sh
          target: /opt/arweqah-platform
      - uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: TAG,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd /opt/arweqah-platform
            # The job token only lives for this run: no long-lived registry password is stored on the server.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            bash scripts/server/deploy.sh "$TAG"
            docker logout ghcr.io
      - name: Smoke test
        run: |
          for i in $(seq 1 12); do
            curl -fsS "${{ vars.APP_URL }}/api/health" && exit 0
            sleep 10
          done
          exit 1
