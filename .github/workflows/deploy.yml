name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, dev]
  workflow_dispatch:

# dev deploys to staging, main to production (the environment is chosen from the branch). One deploy per environment at a time.
concurrency: deploy-${{ (github.event.workflow_run.head_branch || github.ref_name) == 'main' && 'production' || 'staging' }}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  IMAGE_PREFIX: arweqah-platform

jobs:
  build:
    # workflow_run also fires for pull requests; only a successful CI run of a push to main or dev (never a fork's code) may deploy.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    # The environment supplies MICROSOFT_ENABLED for the web build: staging for dev, production for main.
    environment: ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'main' && 'production' || 'staging' }}
    env:
      # The web image bakes in the environment's MICROSOFT_ENABLED, so staging and production must never share a tag, even on the same commit (production keeps the plain SHA, staging gets a suffix).
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}${{ (github.event.workflow_run.head_branch || github.ref_name) == 'main' && '' || '-staging' }}
    strategy:
      matrix:
        app: [api, web]
    steps:
      # Safe: the job runs only for a successful CI run of a push to main or dev (see the `if`), never for pull requests or forks.
      # nosemgrep: yaml.github-actions.security.workflow-run-target-code-checkout.workflow-run-target-code-checkout
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase registry
        run: echo "REGISTRY=${REGISTRY,,}" >> $GITHUB_ENV
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          build-args: |
            APK_CACHE_BUST=${{ github.event.workflow_run.head_sha || github.sha }}
            VITE_MICROSOFT_ENABLED=${{ vars.MICROSOFT_ENABLED || 'false' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:${{ (github.event.workflow_run.head_branch || github.ref_name) == 'main' && 'latest' || 'dev' }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'main' && 'production' || 'staging' }}
    env:
      # The web image bakes in the environment's MICROSOFT_ENABLED, so staging and production must never share a tag, even on the same commit (production keeps the plain SHA, staging gets a suffix).
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}${{ (github.event.workflow_run.head_branch || github.ref_name) == 'main' && '' || '-staging' }}
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'push'
    permissions:
      contents: read
      packages: read
    steps:
      # Safe: the job runs only for a successful CI run of a push to main or dev (see the `if`), never for pull requests or forks.
      # nosemgrep: yaml.github-actions.security.workflow-run-target-code-checkout.workflow-run-target-code-checkout
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # Compose file, nginx template and deploy scripts travel with the code, so changing them deploys them too.
      - uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.prod.yml,docker/nginx/edge.conf,scripts/server/deploy.sh,scripts/server/backup.sh,scripts/server/reset-org.sh
          target: /opt/arweqah-platform
      - uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          TAG: ${{ env.IMAGE_TAG }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: TAG,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd /opt/arweqah-platform
            # The job token only lives for this run: no long-lived registry password is stored on the server.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            bash scripts/server/deploy.sh "$TAG"
            docker logout ghcr.io
      - name: Smoke test
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "The APP_URL variable is empty. Add it under Settings > Environments > staging or production > Environment variables (a variable, not a secret), e.g. https://stg-portal.arweqah.sa" >&2
            exit 1
          fi
          for i in $(seq 1 12); do
            curl -fsS "$APP_URL/api/health" && exit 0
            sleep 10
          done
          exit 1
