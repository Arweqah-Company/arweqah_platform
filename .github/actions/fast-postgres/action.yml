name: Fast PostgreSQL for tests
description: Turns durability off on the job's PostgreSQL service (a test database is thrown away with the runner), so the suites do not wait for the disk.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        PGPASSWORD: ci_password
      run: |
        psql -h localhost -U arweqah -d arweqah_platform_test -c "ALTER SYSTEM SET fsync = off" -c "ALTER SYSTEM SET synchronous_commit = off" -c "ALTER SYSTEM SET full_page_writes = off" -c "SELECT pg_reload_conf()"
